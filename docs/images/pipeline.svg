<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>Resistance Surface Pipeline</title>
  <desc>Six-step pipeline from GPS telemetry to Transfer to Zürich, with phase annotations.</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>

  <!-- 1. GPS Telemetry -->
  <rect x="20" y="20" width="440" height="56" rx="6" fill="#e8f0fe" stroke="#4a7fff" stroke-width="1.5"/>
  <text x="40" y="44" font-size="13" font-weight="600" fill="#1a1a2e">GPS Telemetry</text>
  <text x="40" y="62" font-size="11" fill="#555">Aargau 2014–2017 · 15-minute fix interval · 16 individuals</text>

  <line x1="240" y1="76" x2="240" y2="96" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. Preprocessing -->
  <rect x="20" y="98" width="440" height="56" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
  <text x="40" y="122" font-size="13" font-weight="600" fill="#1a1a2e">Preprocessing</text>
  <text x="40" y="140" font-size="11" fill="#555">Remove short deployments · drop steps &gt; 3,000 m · resample to 15 min</text>

  <line x1="240" y1="154" x2="240" y2="174" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. Step Classification -->
  <rect x="20" y="176" width="440" height="56" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
  <text x="40" y="200" font-size="13" font-weight="600" fill="#1a1a2e">Step Classification</text>
  <text x="40" y="218" font-size="11" fill="#555">Rule-based classifier → in-matrix (7,824) · in-patch (125,285)</text>

  <line x1="240" y1="232" x2="240" y2="252" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4. iSSF Fitting -->
  <rect x="20" y="254" width="440" height="56" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
  <text x="40" y="278" font-size="13" font-weight="600" fill="#1a1a2e">iSSF Fitting</text>
  <text x="40" y="296" font-size="11" fill="#555">7 covariates · 10 random steps · conditional logistic regression</text>

  <line x1="240" y1="310" x2="240" y2="330" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5. Resistance Surface -->
  <rect x="20" y="332" width="440" height="56" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
  <text x="40" y="356" font-size="13" font-weight="600" fill="#1a1a2e">Resistance Surface</text>
  <text x="40" y="374" font-size="11" fill="#555">R = exp(4 · (1 − S)) · burn-in for barriers and passages · 25 m grid</text>

  <line x1="240" y1="388" x2="240" y2="408" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 6. Transfer to Zürich -->
  <rect x="20" y="410" width="440" height="56" rx="6" fill="#e8f0fe" stroke="#4a7fff" stroke-width="1.5"/>
  <text x="40" y="434" font-size="13" font-weight="600" fill="#1a1a2e">Transfer to Zürich</text>
  <text x="40" y="452" font-size="11" fill="#555">Same β · Zürich-local min-max normalisation · ASF fence burn-in</text>

  <!-- Divider line -->
  <line x1="470" y1="20" x2="470" y2="466" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Phase 1 bracket (steps 1–3) -->
  <line x1="474" y1="48" x2="474" y2="204" stroke="#bbb" stroke-width="1.5"/>
  <line x1="474" y1="48"  x2="480" y2="48"  stroke="#bbb" stroke-width="1.5"/>
  <line x1="474" y1="204" x2="480" y2="204" stroke="#bbb" stroke-width="1.5"/>
  <text x="486" y="112" font-size="11" font-weight="600" fill="#666">Phase 1</text>
  <text x="486" y="127" font-size="10" fill="#888">Telemetry</text>
  <text x="486" y="141" font-size="10" fill="#888">preparation</text>

  <!-- Phase 2 bracket (steps 4–5) -->
  <line x1="474" y1="282" x2="474" y2="388" stroke="#bbb" stroke-width="1.5"/>
  <line x1="474" y1="282" x2="480" y2="282" stroke="#bbb" stroke-width="1.5"/>
  <line x1="474" y1="388" x2="480" y2="388" stroke="#bbb" stroke-width="1.5"/>
  <text x="486" y="322" font-size="11" font-weight="600" fill="#666">Phase 2</text>
  <text x="486" y="337" font-size="10" fill="#888">Modelling</text>

  <!-- Phase 3 (step 6) -->
  <line x1="474" y1="438" x2="480" y2="438" stroke="#bbb" stroke-width="1.5"/>
  <text x="486" y="434" font-size="11" font-weight="600" fill="#666">Phase 3</text>
  <text x="486" y="449" font-size="10" fill="#888">Transfer</text>

  <!-- Output note -->
  <text x="20" y="496" font-size="10.5" fill="#888">Output: 25 m resistance raster (Aargau) · 25 m resistance raster (Zürich)</text>
</svg>
