<svg viewBox="0 0 720 600" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, sans-serif">
  <title>QGIS Plugin Workflow</title>
  <desc>Workflow from resistance raster input through user interaction and landscape modification to five parallel analyses and map output.</desc>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a7fff"/>
    </marker>
  </defs>

  <!-- 1. Input -->
  <rect x="210" y="10" width="300" height="48" rx="6" fill="#e8f0fe" stroke="#4a7fff" stroke-width="1.5"/>
  <text x="360" y="30" font-size="13" font-weight="600" fill="#1a1a2e" text-anchor="middle">Pre-computed Resistance Raster</text>
  <text x="360" y="48" font-size="11" fill="#555" text-anchor="middle">25 m grid · Zürich extent</text>

  <line x1="360" y1="58" x2="360" y2="76" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 2. User interaction -->
  <rect x="210" y="78" width="300" height="58" rx="6" fill="#fff8e8" stroke="#e6a817" stroke-width="1.5"/>
  <text x="360" y="98" font-size="13" font-weight="600" fill="#1a1a2e" text-anchor="middle">User Interaction</text>
  <text x="360" y="114" font-size="11" fill="#555" text-anchor="middle">Set outbreak origin · draw fences · place crossings</text>
  <text x="360" y="128" font-size="10" fill="#999" text-anchor="middle">Map-click tools in QGIS canvas</text>

  <line x1="360" y1="136" x2="360" y2="154" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. Landscape modification -->
  <rect x="210" y="156" width="300" height="48" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
  <text x="360" y="176" font-size="13" font-weight="600" fill="#1a1a2e" text-anchor="middle">Landscape Modification</text>
  <text x="360" y="194" font-size="11" fill="#555" text-anchor="middle">Deep copy of raster · fences → NaN · crossings → R = 1</text>

  <line x1="360" y1="204" x2="360" y2="222" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4. Analysis window + cost grid -->
  <rect x="210" y="224" width="300" height="48" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
  <text x="360" y="244" font-size="13" font-weight="600" fill="#1a1a2e" text-anchor="middle">Analysis Window + Cost Grid</text>
  <text x="360" y="262" font-size="11" fill="#555" text-anchor="middle">10 km radius · Dijkstra sweep from outbreak origin</text>

  <!-- Fan-out lines to 5 analyses -->
  <line x1="360" y1="272" x2="360" y2="310" stroke="#888" stroke-width="1.5"/>
  <line x1="66" y1="310" x2="654" y2="310" stroke="#888" stroke-width="1.5"/>
  <line x1="66"  y1="310" x2="66"  y2="328" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="183" y1="310" x2="183" y2="328" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="360" y1="310" x2="360" y2="328" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="537" y1="310" x2="537" y2="328" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="654" y1="310" x2="654" y2="328" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- LCP -->
  <rect x="16" y="330" width="100" height="72" rx="5" fill="#f0f4ff" stroke="#4a7fff" stroke-width="1.2"/>
  <text x="66" y="350" font-size="10.5" font-weight="600" fill="#1a1a2e" text-anchor="middle">Least-Cost</text>
  <text x="66" y="364" font-size="10.5" font-weight="600" fill="#1a1a2e" text-anchor="middle">Path</text>
  <text x="66" y="382" font-size="9.5" fill="#666" text-anchor="middle">Corridor</text>
  <text x="66" y="394" font-size="9.5" fill="#666" text-anchor="middle">backbone</text>

  <!-- Circuit theory -->
  <rect x="133" y="330" width="100" height="72" rx="5" fill="#f0f4ff" stroke="#4a7fff" stroke-width="1.2"/>
  <text x="183" y="350" font-size="10.5" font-weight="600" fill="#1a1a2e" text-anchor="middle">Circuit</text>
  <text x="183" y="364" font-size="10.5" font-weight="600" fill="#1a1a2e" text-anchor="middle">Theory</text>
  <text x="183" y="382" font-size="9.5" fill="#666" text-anchor="middle">Pinchpoints</text>
  <text x="183" y="394" font-size="9.5" fill="#666" text-anchor="middle">and bottlenecks</text>

  <!-- Infection risk -->
  <rect x="310" y="330" width="100" height="72" rx="5" fill="#f0f4ff" stroke="#4a7fff" stroke-width="1.2"/>
  <text x="360" y="350" font-size="10.5" font-weight="600" fill="#1a1a2e" text-anchor="middle">Infection</text>
  <text x="360" y="364" font-size="10.5" font-weight="600" fill="#1a1a2e" text-anchor="middle">Risk</text>
  <text x="360" y="382" font-size="9.5" fill="#666" text-anchor="middle">EFSA zone</text>
  <text x="360" y="394" font-size="9.5" fill="#666" text-anchor="middle">probability</text>

  <!-- BCRW -->
  <rect x="487" y="330" width="100" height="72" rx="5" fill="#f0f4ff" stroke="#4a7fff" stroke-width="1.2"/>
  <text x="537" y="350" font-size="10.5" font-weight="600" fill="#1a1a2e" text-anchor="middle">Biased</text>
  <text x="537" y="364" font-size="10.5" font-weight="600" fill="#1a1a2e" text-anchor="middle">Random Walk</text>
  <text x="537" y="382" font-size="9.5" fill="#666" text-anchor="middle">Stochastic</text>
  <text x="537" y="394" font-size="9.5" fill="#666" text-anchor="middle">movement density</text>

  <!-- iSSF IBM -->
  <rect x="604" y="330" width="100" height="72" rx="5" fill="#f0f4ff" stroke="#4a7fff" stroke-width="1.2"/>
  <text x="654" y="350" font-size="10.5" font-weight="600" fill="#1a1a2e" text-anchor="middle">iSSF</text>
  <text x="654" y="364" font-size="10.5" font-weight="600" fill="#1a1a2e" text-anchor="middle">Agent Model</text>
  <text x="654" y="382" font-size="9.5" fill="#666" text-anchor="middle">Disease spread</text>
  <text x="654" y="394" font-size="9.5" fill="#666" text-anchor="middle">probability</text>

  <!-- Fan-in lines to output -->
  <line x1="66"  y1="402" x2="66"  y2="460" stroke="#888" stroke-width="1"/>
  <line x1="183" y1="402" x2="183" y2="460" stroke="#888" stroke-width="1"/>
  <line x1="360" y1="402" x2="360" y2="460" stroke="#888" stroke-width="1"/>
  <line x1="537" y1="402" x2="537" y2="460" stroke="#888" stroke-width="1"/>
  <line x1="654" y1="402" x2="654" y2="460" stroke="#888" stroke-width="1"/>
  <line x1="66" y1="460" x2="654" y2="460" stroke="#888" stroke-width="1"/>
  <line x1="360" y1="460" x2="360" y2="476" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect x="210" y="478" width="300" height="48" rx="6" fill="#e8f0fe" stroke="#4a7fff" stroke-width="1.5"/>
  <text x="360" y="498" font-size="13" font-weight="600" fill="#1a1a2e" text-anchor="middle">Map Output</text>
  <text x="360" y="516" font-size="11" fill="#555" text-anchor="middle">Five raster layers loaded into QGIS · &lt; 3 minutes</text>

  <!-- Footer note -->
  <text x="360" y="580" font-size="10" fill="#999" text-anchor="middle">Five analyses run in a background thread — interface stays responsive</text>
</svg>
